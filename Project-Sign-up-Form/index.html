<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUpForm</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <section id="Section-Odin-Project">

        <div id="Div-Logo">

            <a id="Img-Logo-Link-Site-Odin-Project" href="https://www.theodinproject.com/">

                <img id="Img-Logo-Site-Odin-Project" src="odin-lined.png" alt="Odin Project Logo">

            </a>

            <a id="Text-Logo-Link-Site-Odin-Project" href="https://www.theodinproject.com/">The Odin Project</a>

        </div>

    </section>


    <section id="Section-Form">

        <div id="div-descriptions">
        <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.<br>Sign up now to set started<br><br>You know you want to.</p>
        </div>

        <div id="div-form">

        <form action="https://httpbin.org/post" method="post" id="forms">

        <h1 id="call-to-form">Let's do this!</h1>

            <div class="div-fieldsets">
                <fieldset id="fieldset-name">

                    <div>
                    <label for="first_name">First Name:</label>
                    <br>
                    <input type="text" name="first_name" id="form-first_name" placeholder="Leonardo" required>
                    </div>

                    <div>
                    <label for="last_name">Last Name:</label>
                    <br>
                    <input type="text" name="last_name" id="form-last_name" placeholder="Domingues" required>
                    </div>

                </fieldset>
            </div>

            <div class="div-fieldsets">
                <fieldset id="fieldset-contato">

                    <div>
                    <label for="email">Email:</label>
                    <br>
                    <input type="email" name="email" id="form-email" placeholder="leofer@gmail.com" required>
                    </div>
                    
                    <div>
                    <label for="phone_number">Phone Number:</label>
                    <br>
                    <input type="number" name="phone_number" id="form-phone_number" placeholder="(88) 928323434" required max="99999999999" minlength="11111111111">
                    </div>

                </fieldset>
            </div>

            <div class="div-fieldsets">
                <fieldset id="fieldset-senha">

                    <div>
                    <label for="password">Password:</label>
                    <br>
                    <input type="password" name="password" id="form-password" required maxlength="20" minlength="10" class="Password">
                    </div>
                    
                    <div>
                    <label for="confirm_password">Confirm Password:</label>
                    <br>
                    <input type="password" name="confirm_password" id="form-confirm_password" required maxlength="20" minlength="10" class="Password">
                    </div>

                </fieldset>
            </div>

        </form>
        </div>

        <div id="div-btn">
        <button type="submit" form="forms" id="btn_form">Create Account</button>
        <h3>Already have an account? <a href="https://www.theodinproject.com/users/sign_in" id="login-link">Log in</a></h3>
        </div>

    </section>



    
</body>
</html>
